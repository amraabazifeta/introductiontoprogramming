<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IBU Brainiac Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🧠 Brainiac Quiz</h1>
    <div id="high-score-display">Best Score: <span id="top-score">0</span></div>
  </header>

  <main>
    <section id="start-screen" class="card">
      <h2>Welcome to the Challenge!</h2>
      <p>10 questions, 30 seconds each. Are you ready?</p>
      <button id="start-btn" class="btn-primary">Start Quiz</button>
    </section>

    <section id="quiz-screen" class="card hidden">
      <div class="quiz-header">
        <span id="progress">Question 1 of 10</span>
        <div id="timer">Time: <span id="seconds">30</span>s</div>
      </div>
      <div id="question-text">Loading question...</div>
      <div id="options-container" class="options-grid"></div>
    </section>

    <section id="result-screen" class="card hidden">
      <h2>Quiz Completed!</h2>
      <div class="score-circle">
        <span id="final-score">0</span>/10
      </div>
      <button id="restart-btn" class="btn-secondary">Play Again</button>
    </section>
  </main>

  <footer>
    <p>IBU Week 9 • Final Project</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
