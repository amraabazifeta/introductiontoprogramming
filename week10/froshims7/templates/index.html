{% extends "layout.html" %}

{% block body %}
    <h1>Register</h1>

    <form action="/register" method="post">

        <input autocomplete="off" autofocus name="name" placeholder="Name" type="text">

        <h3>Select Sports:</h3>
        {% for sport in sports %}
            <div>
                <input name="sport" type="checkbox" value="{{ sport }}"> {{ sport }}
            </div>
        {% endfor %}

        <button type="submit">Register</button>

    </form>

{% endblock %}
