{% extends "layout.html" %}

{% block body %}
    <h1>Register</h1>

    <form action="/register" method="post">

        <input name="name" placeholder="Name" type="text" autocomplete="off">

        {% for sport in sports %}
            <div>
                <input name="sport" type="radio" value="{{ sport }}"> {{ sport }}
            </div>
        {% endfor %}

        <button type="submit">Register</button>

    </form>
{% endblock %}
